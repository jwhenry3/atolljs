# Publish — creating a GitHub Release STAGES every package at the release
# tag's version (lockstep; repo files keep version "0.0.0" — the release
# artifact carries the stamped version). Staged packages are not
# installable until a maintainer approves them — `npm stage list/view/
# approve`, or the Staged Packages tab on npmjs.com (approval needs 2FA).
#
# Auth: npm trusted publishing (OIDC) — `id-token: write` lets the npm CLI
# exchange the job's OIDC token for a short-lived credential; no stored
# secret. Requires a trust relationship per package:
#   npm trust github <pkg> --repo jwhenry3/atolljs --file publish.yml --allow-stage-publish -y
# Use --allow-stage-publish WITHOUT --allow-publish so this workflow is
# stage-only — direct `npm publish` is rejected outright. Until a package
# has a trust relationship, NODE_AUTH_TOKEN (granular NPM_TOKEN secret)
# covers it — remove that env var once all packages are configured.
name: Publish

on:
  release:
    types: [published]

jobs:
  # Don't publish a red tree: the same suites as ci.yml, sharded across
  # parallel jobs (no coverage here; ci.yml owns the thresholds).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nestjs/package-lock.json
            examples/nextjs/package-lock.json
            examples/react-dom-worker/package-lock.json
            examples/express/package-lock.json
            examples/fastify/package-lock.json
            examples/hono/package-lock.json
            examples/koa/package-lock.json
            examples/http-offload/package-lock.json

      - name: Install dependencies
        run: node scripts/ci-install.mjs

      # packages/node's sharedBuffer.functional.test spawns REAL
      # worker_threads that import '@atolljs/core' via a loader hook that
      # maps to dist/index.js — the built lib bundle must exist BEFORE tests.
      - name: Build core bundle (dist/index.js — needed by worker_threads tests)
        run: npx vite build

      - name: Test — shard ${{ matrix.shard }}/4
        run: npx vitest run --shard=${{ matrix.shard }}/4

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nestjs/package-lock.json
            examples/nextjs/package-lock.json
            examples/react-dom-worker/package-lock.json
            examples/express/package-lock.json
            examples/fastify/package-lock.json
            examples/hono/package-lock.json
            examples/koa/package-lock.json
            examples/http-offload/package-lock.json

      - name: Upgrade npm (stage requires CLI >= 11.15.0)
        run: npm install -g "npm@^11"

      # Example toolchains are installed by scripts/ci-install.mjs — the
      # list lives there so this workflow and ci.yml can't drift.
      - name: Install dependencies
        run: node scripts/ci-install.mjs

      - name: Build core bundle (dist/index.js)
        run: npx vite build

      # Unit tests drive the CLI through scriptIo — exercise the real entry
      # (shebang + Node type stripping of the .ts sources) before staging;
      # publish.mjs then bundles dist/cli.js as the shipped bin.
      - name: Smoke — atoll bin runs
        run: node packages/cli/src/cli.ts --help

      - name: Build core package types (index.d.ts)
        run: npx tsc -p tsconfig.build.json

      - name: Stamp versions + stage all packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback until all packages have OIDC trust
        run: node scripts/publish.mjs "${{ github.event.release.tag_name }}"

  # Immutable docs snapshot for the release tag — uploaded as a
  # docs-v<x.y.z>.tar.gz release asset. The Pages workflow downloads these
  # assets and mounts them under consumer/v<x.y.z>/ (see
  # fetch-docs-versions.mjs + assemble-pages.mjs), so the deployed site's
  # version switcher stays in lock step with releases. Runs after `publish`
  # so a failed staging never ships docs for a release that didn't land.
  docs-snapshot:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    steps:
      # Release events check out the tag's ref — the snapshot is built from
      # exactly the commit the release points at.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-consumer/package-lock.json
            examples/react/package-lock.json
            examples/vue/package-lock.json
            examples/solid/package-lock.json
            examples/svelte/package-lock.json
            examples/angular/package-lock.json
            examples/react-dom-worker/package-lock.json
            examples/react-host/package-lock.json
            examples/vue-host/package-lock.json
            examples/solid-host/package-lock.json
            examples/svelte-host/package-lock.json
            examples/angular-host/package-lock.json
            examples/mfe-publish/package-lock.json
            examples/mfe-consumer/package-lock.json

      - name: Install dependencies
        run: |
          set -e
          # Root deps first — example projects alias @atolljs/* to the root
          # source tree, whose imports resolve upward to root node_modules.
          npm ci
          for d in docs-consumer examples/react examples/vue examples/solid examples/svelte examples/angular examples/react-dom-worker examples/react-host examples/vue-host examples/solid-host examples/svelte-host examples/angular-host examples/mfe-publish examples/mfe-consumer; do
            echo "=== npm ci: $d ==="
            (cd "$d" && npm ci)
          done

      - name: Build docs snapshot tarball
        run: node scripts/snapshot-docs.mjs "${{ github.event.release.tag_name }}"

      - name: Attach snapshot to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" docs-*.tar.gz --clobber

  # Deploy the assembled docs site to GitHub Pages — the reusable workflow
  # from pages.yml. Runs after docs-snapshot so this release's tarball is
  # fetched and mounted under consumer/v<x.y.z>/ in the same deployment.
  # Checkout happens on the tag ref, so the site builds from exactly the
  # commit the release points at (matching the snapshot it mounts).
  deploy-docs:
    needs: docs-snapshot
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/pages.yml

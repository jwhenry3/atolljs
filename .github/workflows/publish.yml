# Publish — creating a GitHub Release STAGES every package at the release
# tag's version (lockstep; repo files keep version "0.0.0" — the release
# artifact carries the stamped version). Staged packages are not
# installable until a maintainer approves them — `npm stage list/view/
# approve`, or the Staged Packages tab on npmjs.com (approval needs 2FA).
#
# Auth: npm trusted publishing (OIDC) — `id-token: write` lets the npm CLI
# exchange the job's OIDC token for a short-lived credential; no stored
# secret. Requires a trust relationship per package:
#   npm trust github <pkg> --repo jwhenry3/atolljs --file publish.yml --allow-stage-publish -y
# Use --allow-stage-publish WITHOUT --allow-publish so this workflow is
# stage-only — direct `npm publish` is rejected outright. Until a package
# has a trust relationship, NODE_AUTH_TOKEN (granular NPM_TOKEN secret)
# covers it — remove that env var once all packages are configured.
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nestjs/package-lock.json
            examples/nextjs/package-lock.json
            examples/react-dom-worker/package-lock.json
            examples/express/package-lock.json
            examples/fastify/package-lock.json
            examples/hono/package-lock.json
            examples/koa/package-lock.json
            examples/http-offload/package-lock.json

      - name: Upgrade npm (stage requires CLI >= 11.15.0)
        run: npm install -g "npm@^11"

      # Example toolchains are installed by scripts/ci-install.mjs — the
      # list lives there so this workflow and ci.yml can't drift.
      - name: Install dependencies
        run: node scripts/ci-install.mjs

      # packages/node's sharedBuffer.functional.test spawns REAL
      # worker_threads that import '@atolljs/core' via a loader hook that
      # maps to dist/index.js — the built lib bundle must exist BEFORE tests.
      - name: Build core bundle (dist/index.js — needed by worker_threads tests)
        run: npx vite build

      - name: Test — all suites (don't publish a red tree)
        run: npx vitest run

      - name: Build core package types (index.d.ts)
        run: npx tsc -p tsconfig.build.json

      - name: Stamp versions + stage all packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback until all packages have OIDC trust
        run: node scripts/publish.mjs "${{ github.event.release.tag_name }}"

# Builds the docs-consumer site + static framework examples and deploys the
# assembled dist-pages/ tree to GitHub Pages:
#   /                 landing page (links to the docs site + repo markdown docs)
#   /consumer/        docs-consumer site (+ demo mounts embedded by its iframes)
#   /consumer/vX.Y/   versioned docs snapshots — tarballs attached to each
#                     release by publish.yml's docs-snapshot job, fetched below
#
# NOTE: GitHub Pages cannot set COOP/COEP response headers — the assembled
# artifact ships coi-sw.js, a service worker that injects them so
# SharedArrayBuffer works anyway (first visit reloads once). Where isolation
# still isn't available the islands demo falls back to its poll transport and
# the shared-memory demos show a notice. (The internals docs are in-repo
# markdown under docs/ and don't deploy.)
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'pages-landing/**'
      - 'docs-consumer/**'
      - 'examples/**'
      - 'packages/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-consumer/package-lock.json
            examples/react/package-lock.json
            examples/vue/package-lock.json
            examples/solid/package-lock.json
            examples/svelte/package-lock.json
            examples/angular/package-lock.json
            examples/react-dom-worker/package-lock.json
            examples/react-host/package-lock.json
            examples/vue-host/package-lock.json
            examples/solid-host/package-lock.json
            examples/svelte-host/package-lock.json
            examples/angular-host/package-lock.json
            examples/mfe-publish/package-lock.json
            examples/mfe-consumer/package-lock.json

      - name: Install dependencies
        run: |
          set -e
          # Root deps first: every project aliases @atolljs/core/* to the
          # root source tree, whose imports (react, zod, msgpackr, solid-js,
          # node:* types) resolve upward to the root node_modules.
          npm ci
          for d in docs-consumer examples/react examples/vue examples/solid examples/svelte examples/angular examples/react-dom-worker examples/react-host examples/vue-host examples/solid-host examples/svelte-host examples/angular-host examples/mfe-publish examples/mfe-consumer; do
            echo "=== npm ci: $d ==="
            (cd "$d" && npm ci)
          done

      # Pull docs-v*.tar.gz release assets into docs-versions/ so the
      # assembler can mount them under consumer/v<x.y.z>/. gh reads releases
      # with the token's contents:read permission; no gh → empty manifest.
      - name: Fetch versioned docs snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-docs-versions.mjs

      - name: Build and assemble Pages artifact
        run: node scripts/build-pages.mjs
        env:
          # Blog posts cite consumer docs with absolute paths — the Pages
          # deployment mounts the consumer site under /<repo>/consumer/.
          VITE_CONSUMER_BASE: /atolljs/consumer/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Builds the docs sites + static framework examples and deploys the assembled
# dist-pages/ tree to GitHub Pages:
#   /           landing page (links to both docs sites)
#   /sdk/       docs site (+ demo mounts embedded by its iframes)
#   /consumer/  docs-consumer site (+ its own demo mounts)
#
# NOTE: GitHub Pages cannot set COOP/COEP response headers, so
# SharedArrayBuffer is unavailable there — the embedded live demos and the
# in-page playground will not run on Pages. The docs content deploys fine.
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'docs-consumer/**'
      - 'examples/**'
      - 'packages/**'
      - 'src/sdk/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
            docs-consumer/package-lock.json
            examples/react/package-lock.json
            examples/vue/package-lock.json
            examples/solid/package-lock.json
            examples/svelte/package-lock.json
            examples/angular/package-lock.json

      - name: Install dependencies
        run: |
          set -e
          # Root deps first: every project aliases @jwhenry123/mesh/* to the
          # root source tree, whose imports (react, zod, msgpackr, solid-js,
          # node:* types) resolve upward to the root node_modules.
          npm ci
          for d in docs docs-consumer examples/react examples/vue examples/solid examples/svelte examples/angular; do
            echo "=== npm ci: $d ==="
            (cd "$d" && npm ci)
          done

      - name: Build and assemble Pages artifact
        run: node scripts/build-pages.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

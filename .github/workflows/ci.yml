# Continuous integration — typechecks + unit tests.
#
# The root vitest config runs every suite in the repo: src plus all
# packages/*/test (bindings, incidents domain, node/nestjs adapters).
# Typechecks run per-tsconfig so each publishable package is verified against
# only its own declared peer dependency graph.
#
# Tests run as parallel shard jobs (`vitest --shard=i/4`), each writing a
# blob report that carries its coverage; the `coverage` job merges them and
# checks the thresholds once (a shard alone only sees its slice, so
# vitest.config.ts skips thresholds on --shard runs). Changing the shard
# count means editing the matrix, the job name, and the --shard flag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs — a hijacked major tag can't move
      # the pin. Dependabot still bumps SHAs (see .github/dependabot.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nestjs/package-lock.json
            examples/nextjs/package-lock.json
            examples/react-dom-worker/package-lock.json
            examples/express/package-lock.json
            examples/fastify/package-lock.json
            examples/hono/package-lock.json
            examples/koa/package-lock.json
            examples/http-offload/package-lock.json

      # Example toolchains are installed by scripts/ci-install.mjs — the
      # list lives there so this workflow and publish.yml can't drift.
      - name: Install dependencies
        run: node scripts/ci-install.mjs

      - name: Typecheck — core SDK + app sources
        run: npx tsc --noEmit

      - name: Typecheck — publishable packages
        run: |
          set -e
          for pkg in react vue solidjs svelte angular nextjs node nestjs incidents islands react-island vue-island svelte-island solid-island angular-island cli vite devtools; do
            echo "--- packages/$pkg"
            npx tsc -p "packages/$pkg/tsconfig.json"
          done

      # The unit tests drive the CLI through scriptIo — this exercises the
      # real entry: shebang, argv parsing, and Node's type stripping of the
      # .ts sources (publish.mjs bundles the same sources to dist/cli.js —
      # the shipped bin — at stage time).
      - name: Smoke — atoll bin runs on the CI toolchain
        run: node packages/cli/src/cli.ts --help

  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish so one failure doesn't hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nestjs/package-lock.json
            examples/nextjs/package-lock.json
            examples/react-dom-worker/package-lock.json
            examples/express/package-lock.json
            examples/fastify/package-lock.json
            examples/hono/package-lock.json
            examples/koa/package-lock.json
            examples/http-offload/package-lock.json

      # Every shard can draw any suite, so each needs the full toolchain.
      - name: Install dependencies
        run: node scripts/ci-install.mjs

      # packages/node's sharedBuffer.functional.test spawns REAL
      # worker_threads that import '@atolljs/core' via a loader hook that
      # maps to dist/index.js — the built lib bundle must exist.
      - name: Build — core SDK lib (needed by real worker_threads tests)
        run: npx vite build

      - name: Test — shard ${{ matrix.shard }}/4 (vitest, with coverage)
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob --reporter=default

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Merge the shard blobs: one test summary, one coverage report, and the
  # threshold check over the whole suite.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm

      # Merging reruns nothing: root deps (vitest + the config's plugins)
      # are all it loads.
      - name: Install root dependencies
        run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: .vitest-reports/
          merge-multiple: true

      - name: Merge shard reports + coverage thresholds
        run: npx vitest run --merge-reports --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Advisory audit — `npm audit` reads each lockfile, no install needed.
  # Fails on high/critical findings; a red audit job means a disclosed
  # vuln exists in a pinned tree even though `npm ci` output is unchanged.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26

      - name: Audit all lockfiles
        run: |
          set -e
          for d in . docs-consumer examples/*; do
            if [ -f "$d/package-lock.json" ]; then
              echo "=== npm audit: $d ==="
              (cd "$d" && npm audit --audit-level=high)
            fi
          done


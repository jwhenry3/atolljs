# Continuous integration — typechecks + unit tests.
#
# The root vitest config runs every suite in the repo: src plus all
# packages/*/test (bindings, incidents domain, node/nestjs adapters).
# Typechecks run per-tsconfig so each publishable package is verified against
# only its own declared peer dependency graph.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs — a hijacked major tag can't move
      # the pin. Dependabot still bumps SHAs (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nestjs/package-lock.json
            examples/nextjs/package-lock.json
            examples/react-dom-worker/package-lock.json
            examples/express/package-lock.json
            examples/fastify/package-lock.json
            examples/hono/package-lock.json
            examples/koa/package-lock.json
            examples/http-offload/package-lock.json

      # Example toolchains are installed by scripts/ci-install.mjs — the
      # list lives there so this workflow and publish.yml can't drift.
      - name: Install dependencies
        run: node scripts/ci-install.mjs

      - name: Typecheck — core SDK + app sources
        run: npx tsc --noEmit

      - name: Typecheck — publishable packages
        run: |
          set -e
          for pkg in react vue solidjs svelte angular nextjs node nestjs incidents islands react-island vue-island svelte-island solid-island angular-island cli; do
            echo "--- packages/$pkg"
            npx tsc -p "packages/$pkg/tsconfig.json"
          done

      # packages/node's sharedBuffer.functional.test spawns REAL
      # worker_threads that import '@atolljs/core' via a loader hook that
      # maps to dist/index.js — the built lib bundle must exist.
      - name: Build — core SDK lib (needed by real worker_threads tests)
        run: npx vite build

      - name: Test — all suites (vitest, with coverage)
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Advisory audit — `npm audit` reads each lockfile, no install needed.
  # Fails on high/critical findings; a red audit job means a disclosed
  # vuln exists in a pinned tree even though `npm ci` output is unchanged.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Audit all lockfiles
        run: |
          set -e
          for d in . docs-consumer examples/*; do
            if [ -f "$d/package-lock.json" ]; then
              echo "=== npm audit: $d ==="
              (cd "$d" && npm audit --audit-level=high)
            fi
          done


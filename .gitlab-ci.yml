# GitLab CI — backup pipeline mirroring .github/workflows/ (kept for when
# GitHub is unavailable). Structure parity:
#
#   ci.yml       → stages `test` + `report`: `checks`, `test` (4 shards,
#                  blob reports), `coverage` (merge + thresholds + codecov),
#                  `audit`
#   publish.yml  → stage `publish`: `publish` runs on tag push (GitLab's
#                  equivalent of a release event) after the same test shards
#                  pass; `docs-snapshot` builds the docs tarball afterwards
#   pages.yml    → stage `deploy`: `pages` deploys dist-pages/ to GitLab
#                  Pages (manual, like workflow_dispatch)
#
# GitHub-specific pieces that don't map:
#   - actions/* steps (checkout, setup-node, upload-artifact) → built-in
#     GitLab image/cache/artifacts.
#   - `gh` CLI calls (release asset fetch/upload) → fetch-docs-versions.mjs
#     runs with no `gh` and produces an empty version manifest; snapshots
#     are published to the GitLab generic package registry instead.
#   - Dependabot → no native GitLab equivalent (Renovate is the usual path).
#
# npm auth for `publish`: trusted publishing works on GitLab via OIDC
# (id_tokens below — configure the trust relationship per package on
# npmjs.com). Until then, set a masked CI/CD variable NODE_AUTH_TOKEN with
# a granular npm token — the same fallback publish.yml uses.

stages: [test, report, publish, deploy]

image: node:26

# Cancel redundant pipelines when a newer one starts (the project's
# "auto-cancel redundant pipelines" setting does the rest).
default:
  interruptible: true

variables:
  # npm cache carried between jobs; Node 26 ships npm 11.x (>= 11.10 needed
  # for min-release-age in .npmrc).
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: 50

workflow:
  # Mirrors `on: push(main) + pull_request` + release events + manual runs.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# cache:key:files accepts at most 2 files — a static key works better here
# anyway: .npm is a content-addressed tarball store, so a stale entry just
# means npm ci fetches the new version on top; nothing goes stale-correct.
.cache-lockfiles: &cache-lockfiles
  key: atoll-npm
  paths:
    - .npm/

# ── test stage ─────────────────────────────────────────────────────────────
# ci.yml's `checks` job — typechecks + CLI smoke.

checks:
  stage: test
  cache: *cache-lockfiles
  script:
    # Example toolchains are installed by scripts/ci-install.mjs — the list
    # lives there so all pipelines share it.
    - node scripts/ci-install.mjs
    - npx tsc --noEmit
    - |
      for pkg in react vue solidjs svelte angular nextjs node nestjs incidents islands react-island vue-island svelte-island solid-island angular-island cli vite devtools; do
        echo "--- packages/$pkg"
        npx tsc -p "packages/$pkg/tsconfig.json"
      done
    - node packages/cli/src/cli.ts --help

# ci.yml's `test` matrix job — four shards, each writing a blob report that
# carries its coverage slice (thresholds are skipped on --shard runs).
test:
  stage: test
  cache: *cache-lockfiles
  parallel:
    matrix:
      - SHARD: [1, 2, 3, 4]
  script:
    - node scripts/ci-install.mjs
    # packages/node's sharedBuffer.functional.test spawns REAL worker_threads
    # that import '@atolljs/core' via a loader hook mapped to dist/index.js —
    # the built lib bundle must exist.
    - npx vite build
    - npx vitest run --coverage --shard=$SHARD/4 --reporter=blob --reporter=default
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - .vitest-reports/

# ci.yml's `audit` job — advisory npm audit over every lockfile; fails on
# high/critical findings.
audit:
  stage: test
  cache: *cache-lockfiles
  script:
    - |
      for d in . docs-consumer examples/*; do
        if [ -f "$d/package-lock.json" ]; then
          echo "=== npm audit: $d ==="
          (cd "$d" && npm audit --audit-level=high)
        fi
      done

# ── report stage ───────────────────────────────────────────────────────────
# ci.yml's `coverage` job — merge the shard blobs: one test summary, one
# coverage report, one threshold check. Codecov upload is best-effort and
# only runs when CODECOV_TOKEN is set as a CI/CD variable.

coverage:
  stage: report
  cache: *cache-lockfiles
  needs:
    - job: test
      artifacts: true
  script:
    - npm ci
    - npx vitest run --merge-reports --coverage
    - |
      if [ -n "$CODECOV_TOKEN" ]; then
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov -t "$CODECOV_TOKEN" -f ./coverage/lcov.info || true
      else
        echo "CODECOV_TOKEN not set — skipping upload"
      fi
  artifacts:
    expire_in: 7 days
    paths:
      - coverage/

# ── publish stage ──────────────────────────────────────────────────────────
# publish.yml — runs on tag push (GitLab's release-event equivalent). Same
# gate: every test shard must pass before staging.
#
# Auth: `npm stage` needs either OIDC trusted publishing or NODE_AUTH_TOKEN.
# GitLab trusted publishing uses the id_tokens block; npm exchanges the JWT
# for a short-lived credential. Configure per package on npmjs.com — and
# unlike publish.yml's GitHub trust, GitLab trust must point at THIS project.

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  needs:
    - job: checks
      artifacts: false
    - job: test
      artifacts: false
  script:
    # npm stage requires CLI >= 11.15.0
    - npm install -g "npm@^11"
    # setup-node's registry-url equivalent — only when token auth is used;
    # trusted publishing (id_tokens) needs no stored credential.
    - |
      if [ -n "$NODE_AUTH_TOKEN" ]; then
        echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
      fi
    - node scripts/ci-install.mjs
    - npx vite build
    - node packages/cli/src/cli.ts --help
    - npx tsc -p tsconfig.build.json
    # publish.mjs stamps versions + stages every package (repo files keep
    # version "0.0.0" — staging is approval-gated on npmjs.com).
    - node scripts/publish.mjs "$CI_COMMIT_TAG"

# publish.yml's `docs-snapshot` job — immutable docs tarball per release tag.
# GitHub attaches it to the release; here it goes to the project's generic
# package registry (JOB-TOKEN auth) and the job artifacts.

docs-snapshot:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: publish
      artifacts: false
  cache: *cache-lockfiles
  script:
    - npm ci
    - |
      for d in docs-consumer examples/react examples/vue examples/solid examples/svelte examples/angular examples/react-dom-worker examples/react-host examples/vue-host examples/solid-host examples/svelte-host examples/angular-host examples/mfe-publish examples/mfe-consumer; do
        echo "=== npm ci: $d ==="
        (cd "$d" && npm ci)
      done
    - node scripts/snapshot-docs.mjs "$CI_COMMIT_TAG"
    # Upload each docs-*.tar.gz to the generic package registry. To turn a
    # tag into a GitLab Release with these as asset links, add a `release:`
    # block or run `glab release create "$CI_COMMIT_TAG" docs-*.tar.gz`
    # (glab is not on the node image — use the registry image or curl).
    - |
      for f in docs-*.tar.gz; do
        echo "=== upload $f ==="
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docs-snapshots/${CI_COMMIT_TAG}/$f"
      done
  artifacts:
    expire_in: 30 days
    paths:
      - docs-*.tar.gz

# ── deploy stage ───────────────────────────────────────────────────────────
# pages.yml — manual docs deploy. GitLab Pages serves the `public` artifact
# of a job named `pages`; build-pages.mjs emits dist-pages/, moved into
# place at the end. Same caveat as GitHub Pages: no COOP/COEP headers —
# dist-pages ships coi-sw.js so SharedArrayBuffer still works.

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
  environment:
    name: gitlab-pages
    url: $CI_PAGES_URL
  cache: *cache-lockfiles
  script:
    - npm ci
    - |
      for d in pages-landing docs-consumer examples/react examples/vue examples/solid examples/svelte examples/angular examples/react-dom-worker examples/react-host examples/vue-host examples/solid-host examples/svelte-host examples/angular-host examples/mfe-publish examples/mfe-consumer; do
        echo "=== npm ci: $d ==="
        (cd "$d" && npm ci)
      done
    # No `gh` on GitLab — fetch-docs-versions.mjs produces an empty version
    # manifest (versioned docs snapshots live in the GitHub release assets;
    # port to the package registry if this becomes the primary host).
    - node scripts/fetch-docs-versions.mjs || true
    - node scripts/build-pages.mjs
    - mv dist-pages public
  artifacts:
    paths:
      - public
  variables:
    # GitLab Pages mounts the project at /<group>/<project> — the consumer
    # site sits under consumer/ inside that. Adjust if the repo is renamed.
    VITE_CONSUMER_BASE: "/$CI_PROJECT_NAME/consumer/"

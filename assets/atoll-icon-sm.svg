<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <filter id="silhouette" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="14" result="d"/>
      <feFlood flood-color="#03101c" flood-opacity="1"/>
      <feComposite in2="d" operator="in"/>
    </filter>
    <!-- outer-only contour: interior of the ring (r<331) is masked out so the
         outline hugs the exterior silhouette, not the ring's inner rim or the
         concavities between islets -->
    <mask id="outerOnly">
      <rect width="1000" height="1000" fill="#fff"/>
      <circle cx="500" cy="500" r="331" fill="#000"/>
    </mask>
  </defs>
  <circle cx="500" cy="500" r="318" fill="#5ec4ee"/>
  <g mask="url(#outerOnly)"><g filter="url(#silhouette)">
    <circle cx="500" cy="500" r="350" fill="none" stroke="#04101e" stroke-opacity="0.25" stroke-width="66"/>
    <circle cx="500" cy="500" r="350" fill="none" stroke="#ecc48c" stroke-width="56"/>
    <ellipse cx="500.0" cy="150.0" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="747.5" cy="252.5" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="850.0" cy="500.0" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="747.5" cy="747.5" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="500.0" cy="850.0" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="252.5" cy="747.5" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="150.0" cy="500.0" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="252.5" cy="252.5" rx="94" ry="72" fill="#55b157"/>
  </g></g>
  <g>
    <circle cx="500" cy="500" r="350" fill="none" stroke="#04101e" stroke-opacity="0.25" stroke-width="66"/>
    <circle cx="500" cy="500" r="350" fill="none" stroke="#ecc48c" stroke-width="56"/>
    <ellipse cx="500.0" cy="150.0" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="747.5" cy="252.5" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="850.0" cy="500.0" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="747.5" cy="747.5" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="500.0" cy="850.0" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="252.5" cy="747.5" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="150.0" cy="500.0" rx="94" ry="72" fill="#55b157"/>
    <ellipse cx="252.5" cy="252.5" rx="94" ry="72" fill="#55b157"/>
  </g>
  <text x="500" y="680" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="560" fill="#16405a"
        stroke="#0f3550" stroke-opacity="0.7"
        stroke-width="0" paint-order="stroke" stroke-linejoin="round">A</text>
</svg>

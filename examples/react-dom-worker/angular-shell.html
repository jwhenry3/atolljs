<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angular Worker Islands — Angular in the worker</title>
    <script>
      // GitHub Pages can't send COOP/COEP headers — coi-sw.js injects them
      // via a service worker so SharedArrayBuffer exists there (push-mode
      // doorbell). First visit reloads once so the document becomes
      // controlled; if isolation never arrives the islands run in poll mode.
      (function () {
        var flag = 'coi-reload:' + location.pathname;
        if (window.crossOriginIsolated) { sessionStorage.removeItem(flag); return; }
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker
          .register('coi-sw.js')
          .then(function () { return navigator.serviceWorker.ready; })
          .then(function () {
            if (sessionStorage.getItem(flag)) return;
            sessionStorage.setItem(flag, '1');
            location.reload();
          })
          .catch(function () {});
      })();
    </script>
    <!--
      Angular islands running INSIDE workers (src/angular-shell.ts mounts
      <atoll-island> JIT components): each island mounts through @atolljs/angular-island onto apps
      served by src/worker/angular.worker.ts — JIT @Component classes (signal inputs + zoneless CD) whose render loop lives off
      the main thread.
    -->
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #101418; color: #e6edf3; }
      #root { max-width: 960px; margin: 0 auto; padding: 24px; }
      button, input { font: inherit; }
      input { padding: 6px 10px; background: #1c2330; color: inherit; border: 1px solid #303845; border-radius: 6px; }
      button { padding: 6px 12px; background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
      button:hover { background: #3d7bef; }
      table { border-collapse: collapse; width: 100%; }
      td, th { padding: 3px 8px; border-bottom: 1px solid #262d38; text-align: left; }
      /* shell chrome */
      #transport-bar {
        display: flex; gap: 16px; align-items: center; font: 12px monospace; color: #9aa4b2;
        padding: 8px 12px; border: 1px solid #2a3340; border-radius: 6px; margin-bottom: 12px;
      }
      #status-line { font: 12px monospace; color: #7fb6ff; margin-bottom: 12px; min-height: 1em; }
      .island { border: 1px solid #2a3340; border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
      .island-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 6px 12px; background: #161c26; border-bottom: 1px solid #2a3340;
        font: 12px monospace; color: #9aa4b2;
      }
      .island-head .badge {
        padding: 1px 8px; border-radius: 8px; background: #1f4d2e; color: #a9e5c3; font-weight: 700;
      }
      .island-root { padding: 8px 12px; }
      .island-root table { max-height: 360px; }
      /* worker-created island content — shell-side styling of op-applied DOM */
      .vanilla-heading, .vanilla-readout { margin: 4px 0 8px; font-size: 13px; color: #9aa4b2; }
      .vanilla-readout { color: #e6edf3; }
      .vanilla-log { margin-top: 8px; font: 11px/1.7 monospace; color: #7d8a9c; }
      .vanilla-log-line { border-left: 2px solid #2a3340; padding-left: 8px; }
      .mw-btn { padding: 3px 10px; background: #22354f; font-size: 12px; }
      .mw-btn:hover { background: #2d4365; }
      .atoll-map-places { display: flex; gap: 4px; }
      .atoll-map-place-btn {
        padding: 3px 8px; font: 11px monospace; background: #22354f; color: #e6edf3;
        border: 0; border-radius: 4px; cursor: pointer;
      }
      .atoll-map-place-btn:hover { background: #2d4365; }
      /* the 1M-incidents island — a virtualized scroller rendered worker-side */
      .inc-stats { font: 12px monospace; color: #9aa4b2; margin-bottom: 6px; }
      .inc-viewport { height: 320px; overflow-y: auto; border: 1px solid #2a3340; border-radius: 6px; }
      .inc-spacer { position: relative; }
      .inc-row {
        position: absolute; left: 0; right: 0; height: 24px;
        display: flex; gap: 10px; align-items: center; padding: 0 10px;
        font: 12px/24px monospace; color: #c9d4e0; box-sizing: border-box; white-space: nowrap;
      }
      .inc-row:nth-child(odd) { background: #141a22; }
      .inc-id { color: #7d8a9c; width: 80px; }
      .inc-site { width: 110px; }
      .inc-region { width: 90px; color: #9aa4b2; }
      .inc-sev { padding: 0 8px; border-radius: 8px; font-size: 11px; }
      .inc-sev.sev-p1 { background: #7d2b2b; color: #ffd6d6; }
      .inc-sev.sev-p2 { background: #6f5a1e; color: #ffe9b3; }
      .inc-sev.sev-p3 { background: #1f4d2e; color: #a9e5c3; }
      .inc-sev.sev-p4 { background: #22354f; color: #bcd4f0; }
      .inc-dur { margin-left: auto; color: #7d8a9c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/angular-shell.ts"></script>
  </body>
</html>

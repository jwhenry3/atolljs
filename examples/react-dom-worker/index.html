<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Worker Islands — DOM ops over postMessage</title>
    <!--
      Minimal styling: the point of this page is that each .island-root is
      populated entirely by ops applied in src/island.ts — there is no React
      on the main thread at all. Each island is its own Web Worker running
      the SAME worker script with a different registry app mounted.
    -->
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #101418; color: #e6edf3; }
      #root { max-width: 960px; margin: 0 auto; padding: 24px; }
      button, input { font: inherit; }
      input { padding: 6px 10px; background: #1c2330; color: inherit; border: 1px solid #303845; border-radius: 6px; }
      button { padding: 6px 12px; background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
      button:hover { background: #3d7bef; }
      table { border-collapse: collapse; width: 100%; }
      td, th { padding: 3px 8px; border-bottom: 1px solid #262d38; text-align: left; }
      /* shell chrome */
      #transport-bar {
        display: flex; gap: 16px; align-items: center; font: 12px monospace; color: #9aa4b2;
        padding: 8px 12px; border: 1px solid #2a3340; border-radius: 6px; margin-bottom: 12px;
      }
      #status-line { font: 12px monospace; color: #7fb6ff; margin-bottom: 12px; min-height: 1em; }
      .island { border: 1px solid #2a3340; border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
      .island-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 6px 12px; background: #161c26; border-bottom: 1px solid #2a3340;
        font: 12px monospace; color: #9aa4b2;
      }
      .island-head .badge {
        padding: 1px 8px; border-radius: 8px; background: #1f4d2e; color: #a9e5c3; font-weight: 700;
      }
      .island-root { padding: 8px 12px; }
      .island-root table { max-height: 360px; }
      #island-table { max-height: 380px; overflow-y: auto; display: block; }
    </style>
  </head>
  <body>
    <div id="root">
      <h1>React islands — each in its own worker</h1>
      <div id="transport-bar">
        <span>transport:</span>
        <button id="push-btn">push (SAB doorbell)</button>
        <button id="poll-btn">poll (50ms)</button>
        <span id="transport-stats"></span>
      </div>
      <div id="status-line">mounting islands…</div>

      <section class="island">
        <div class="island-head"><span>app: controls</span><span class="badge" id="badge-controls">worker …</span></div>
        <div class="island-root" id="island-controls"></div>
      </section>

      <section class="island">
        <div class="island-head"><span>app: data-table</span><span class="badge" id="badge-table">worker …</span></div>
        <div class="island-root" id="island-table"></div>
      </section>

      <section class="island">
        <div class="island-head"><span>app: stats</span><span class="badge" id="badge-stats">worker …</span></div>
        <div class="island-root" id="island-stats"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
